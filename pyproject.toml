[project]
name = "chicago-transit"
version = "0.1.0"
description = "CTA and Metra vehicle data pipeline into BigQuery, with a FastAPI backend and a React + Vega live map and delay analytics."
dependencies = [
    "python-dotenv>=1.1.0",
    "pandas>=2.3.0,<3",
    "numpy>=2.3.0",
    "pandas-gbq>=0.29.1",
    "google-cloud-bigquery>=3.34.0",
    "requests>=2.32.0",
    "sodapy>=2.2.0",
    "gtfs-realtime-bindings>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]
readme = "README.md"
requires-python = ">= 3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/chicago_transit"]
